  # tsrs (Rust port of typescript-go) runs `typecheck` and, through
  # `tsrs-lint`, oxlint's type-aware rules. Keep its version on the same
  # TypeScript release as `typescript` below so both compilers agree.
  'tsrs': '7.1.0-beta.tsrs3'
  # 7.1 beta on purpose: tsdown 0.23's rolldown-plugin-dts (^0.30) emits
  # declarations through 7.1's Go API (`dts.generator: 'tsgo'`), and its 7.0
  # path is deprecated. Move to 7.1.0 once it is stable, and bump `tsrs` to
  # the release built on the same TypeScript version at the same time.
  'typescript': '7.1.0-beta'
