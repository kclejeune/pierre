# Cloudflare Workers deployment via @opennextjs/cloudflare. The Worker created
# in the dashboard must also be named "diffs" — Workers Builds fails the build
# when the dashboard name and this name disagree.
#
# Workers Builds settings for this monorepo:
#   root directory:  apps/diffshub
#   build command:   pnpm exec moon run diffshub:cf-build
#   deploy command:  (default) npx wrangler deploy
#
# Runtime secrets (dashboard → Settings → Variables, or `wrangler secret put`):
#   DIFFSHUB_GITHUB_CLIENT_ID / DIFFSHUB_GITHUB_CLIENT_SECRET — OAuth app
#   DIFFSHUB_GITHUB_TOKEN — server fallback token for anonymous visitors
name = "diffs"
main = ".open-next/worker.js"

# nodejs_compat is required by the OpenNext runtime; the date is past
# 2025-04-01 so Worker vars/secrets auto-populate process.env, which is how
# lib/githubEnvironment.ts reads all of its configuration.
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# OpenNext calls back into this Worker for ISR/revalidation work.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "diffs"

# Mirrors the dashboard observability settings so deploys don't flip them.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
