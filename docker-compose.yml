# Self-hosted DiffsHub. From this directory, after setting the DIFFSHUB_*
# variables you need in the environment or a .env file (all optional —
# defaults target public github.com):
#
#   docker compose up --build
#
# All configuration is runtime-only: the image is built without any DIFFSHUB_*
# values (standalone builds render every page at request time), so changing
# .env only needs a container restart, not a rebuild.
services:
  diffshub:
    build:
      context: .
      dockerfile: apps/diffshub/Dockerfile
    environment:
      DIFFSHUB_GITHUB_URL: ${DIFFSHUB_GITHUB_URL:-}
      DIFFSHUB_GITHUB_API_URL: ${DIFFSHUB_GITHUB_API_URL:-}
      DIFFSHUB_GITHUB_RAW_URL: ${DIFFSHUB_GITHUB_RAW_URL:-}
      DIFFSHUB_GITHUB_CLIENT_ID: ${DIFFSHUB_GITHUB_CLIENT_ID:-}
      DIFFSHUB_GITHUB_CLIENT_SECRET: ${DIFFSHUB_GITHUB_CLIENT_SECRET:-}
      DIFFSHUB_PUBLIC_ORIGIN: ${DIFFSHUB_PUBLIC_ORIGIN:-}
      DIFFSHUB_REQUIRE_LOGIN: ${DIFFSHUB_REQUIRE_LOGIN:-}
    ports:
      - 127.0.0.1:${DIFFSHUB_PORT:-3692}:3000
    restart: unless-stopped
