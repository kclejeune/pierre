$schema: 'https://moonrepo.dev/schemas/project.json'

# Local-only tasks avoid presets and set options explicitly. Rule of thumb:
# moon ci executes EVERY affected runInCI-enabled task (requested targets
# only add, never subtract), so `runInCI: 'always'` — which keeps a task
# runnable in CI-marked shells like agent harnesses (CI=1) — is safe only
# for tasks that can never be affected through the graph (no deps, no
# dependents). Graph-connected local tasks (dev/prod/e2e variants) stay
# `runInCI: 'skip'`; run those with a `CI=` prefix, e.g.
# `CI= moonx docs:dev-diffs`.
language: 'typescript'
layer: 'application'

tasks:
  # Next's persistent build cache is an input to future Next builds, not a
  # deploy artifact. Exclude it from moon's output snapshot while still caching
  # the generated app output.
  build:
    command: 'next build'
    deps:
      - '^:build'
    outputs:
      - '.next/**/*'
      - '!.next/cache/**'

  # Build deps run to completion first, then dependency watchers (`^:dev`)
  # run alongside next dev. run-dev.sh kills stale listeners on the port
  # before starting (crashed terminals leak servers).
  dev:
    script:
      'export PORT=$(( ${PIERRE_PORT_OFFSET:-0} + 3692 )) && bash
      ../../scripts/run-dev.sh "$PORT" -- next dev'
    deps:
      - '^:build'
      - '^:dev'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
      envFile: '/.env.worktree'

  start:
    command: 'next start'
    options:
      cache: false
      persistent: true
      runInCI: 'always'

  prod:
    script:
      'export PORT=$(( ${PIERRE_PORT_OFFSET:-0} + 3692 )) && bash
      ../../scripts/run-dev.sh "$PORT" -- next start -p "$PORT"'
    deps:
      - 'build'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
      envFile: '/.env.worktree'

  # Bundles the app for Cloudflare Workers (see wrangler.toml). OpenNext runs
  # its own standalone-mode `next build` (buildCommand in open-next.config.ts)
  # rather than reusing the `build` task's output, which is not standalone.
  # Workers Builds uses this as its build command; deploys stay with the
  # dashboard default (npx wrangler deploy).
  cf-build:
    command: 'opennextjs-cloudflare build'
    deps:
      - '^:build'
    outputs:
      - '.open-next/**/*'
    options:
      runInCI: 'always'

  # Serves the .open-next bundle in the workerd runtime locally — the closest
  # thing to the deployed Worker without deploying.
  cf-preview:
    command: 'opennextjs-cloudflare preview'
    deps:
      - 'cf-build'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
