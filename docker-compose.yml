# Self-hosted DiffsHub. From this directory, after setting the DIFFSHUB_*
# variables you need in the environment or a .env file (all optional —
# defaults target public github.com):
#
#   docker compose up --build
#
# All configuration is runtime-only: the image is built without any DIFFSHUB_*
# values (standalone builds render every page at request time), so changing
# .env only needs a container restart, not a rebuild.
services:
  diffshub:
    build:
      context: .
      dockerfile: apps/diffshub/Dockerfile
    environment:
      DIFFSHUB_GITHUB_URL: ${DIFFSHUB_GITHUB_URL:-}
      DIFFSHUB_GITHUB_API_URL: ${DIFFSHUB_GITHUB_API_URL:-}
      DIFFSHUB_GITHUB_RAW_URL: ${DIFFSHUB_GITHUB_RAW_URL:-}
      DIFFSHUB_GITHUB_CLIENT_ID: ${DIFFSHUB_GITHUB_CLIENT_ID:-}
      DIFFSHUB_GITHUB_CLIENT_SECRET: ${DIFFSHUB_GITHUB_CLIENT_SECRET:-}
      DIFFSHUB_PUBLIC_ORIGIN: ${DIFFSHUB_PUBLIC_ORIGIN:-}
      DIFFSHUB_REQUIRE_LOGIN: ${DIFFSHUB_REQUIRE_LOGIN:-}
      DIFFSHUB_ENABLE_PAT_INPUT: ${DIFFSHUB_ENABLE_PAT_INPUT:-}
      DIFFSHUB_REFRESH_TOKEN_MAX_TTL: ${DIFFSHUB_REFRESH_TOKEN_MAX_TTL:-}
      DIFFSHUB_AVATAR_TOKEN: ${DIFFSHUB_AVATAR_TOKEN:-}
      DIFFSHUB_TOKEN_ENCRYPTION_KEY: ${DIFFSHUB_TOKEN_ENCRYPTION_KEY:-}
      DIFFSHUB_DEFAULT_LIGHT_THEME: ${DIFFSHUB_DEFAULT_LIGHT_THEME:-}
      DIFFSHUB_DEFAULT_DARK_THEME: ${DIFFSHUB_DEFAULT_DARK_THEME:-}
      # Per-user preferences (never credentials) live in the valkey service
      # below. Point this at an external Redis/Valkey instead if you have one.
      DIFFSHUB_REDIS_URL: ${DIFFSHUB_REDIS_URL:-redis://valkey:6379}
    ports:
      - 127.0.0.1:${DIFFSHUB_PORT:-3692}:3000
    depends_on:
      - valkey
    restart: unless-stopped

  # Preference store. Not published to the host; only diffshub reaches it on
  # the compose network. Append-only persistence keeps preferences across
  # restarts in the named volume.
  valkey:
    image: valkey/valkey:9-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - valkey-data:/data
    restart: unless-stopped

volumes:
  valkey-data:
